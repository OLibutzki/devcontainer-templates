services:
  dev:
    # A plain base image with no toolchain assumptions. Swap it for whatever
    # your project needs — nothing in the egress policy depends on it.
    image: mcr.microsoft.com/devcontainers/base:trixie
    init: true
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    networks:
      # The only network this container is on, and it has `internal: true`.
      # There is no default route to the internet here — the sole way out is the
      # egress proxy below. Unsetting the proxy variables does not grant access;
      # it just removes the one path that works.
      - egress-internal
    depends_on:
      egress:
        condition: service_healthy
    environment:
      # Both cases, because tools disagree about which they read.
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,::1,egress
      no_proxy: localhost,127.0.0.1,::1,egress

  egress:
    image: ${templateOption:squidImage}
    restart: unless-stopped
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
      - ./egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      - egress-internal
      - egress-external
    # Intentionally no `ports:` — the proxy is reachable from the dev container
    # and from nowhere else, not from the host and not from the LAN.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/3128' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  egress-internal:
    internal: true
  egress-external:
    driver: bridge
